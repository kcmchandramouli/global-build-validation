---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: '{{ include "gbv_agent.fullname" . }}'
  labels:
    {{- include "gbv_agent.labels" . | nindent 4 }}
spec:
  pollingInterval: 30
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  successfulJobsHistoryLimit: {{ .Values.historyLimit.successfulJobs }}
  failedJobsHistoryLimit: {{ .Values.historyLimit.failedJobs }}
  scalingStrategy:
    strategy: "custom"
    customScalingQueueLengthDeduction: {{ .Values.autoscaling.strategy.customScalingQueueLengthDeduction }}
    customScalingRunningJobPercentage: "{{ .Values.autoscaling.strategy.customScalingRunningJobPercentage }}"
  jobTargetRef:
    template:
      spec:
        {{- with .Values.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        containers:
          - name: '{{ .Chart.Name }}-{{ .Values.image_tag | replace "." "-" }}'
            image: "{{ .Values.image.repository }}:{{ .Values.image_tag }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            resources:
              limits:
                cpu: {{ .Values.resources.limits.cpu }}
                memory: {{ .Values.resources.limits.memory }}
              requests:
                cpu: {{ .Values.resources.requests.cpu }}
                memory: {{ .Values.resources.requests.memory }}
            env:
              - name: AZP_URL
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.secrets.azpSecretName }}
                    key: AZP_URL
              - name: AZP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.secrets.azpSecretName }}
                    key: AZP_TOKEN
              - name: AZP_POOL
                valueFrom:
                  secretKeyRef:
                    name: {{ .Values.secrets.azpSecretName }}
                    key: AZP_POOL
              - name: "{{ .Values.image_tag }}{{ .Values.demand_postfix }}"
                value: "true"
              {{- if .Values.proxy.http_proxy }}
              - name: http_proxy
                value: {{ .Values.proxy.http_proxy | quote }}
              - name: https_proxy
                value: {{ .Values.proxy.https_proxy | quote }}
              - name: no_proxy
                value: {{ .Values.proxy.no_proxy | quote }}
              {{- end }}
            command: ["/usr/local/bin/az_agent.sh"]
            lifecycle:
              preStop:
                exec:
                  command:
                    - "/bin/bash"
                    - "-c"
                    - "{{ .Values.azure_agent_root }}/config.sh remove --auth pat --token $AZP_TOKEN"
  triggers:
    - type: azure-pipelines
      metadata:
        poolName: {{ .Values.azure_devops.poolName }}
        organizationURLFromEnv: "AZP_URL"
        personalAccessTokenFromEnv: "AZP_TOKEN"
        demands: "{{ .Values.image_tag }}{{ .Values.demand_postfix }}"
        requiresAllDemands: "true"
