---
image:
  repository: ghcr.io/YOUR_ORG/global-build-validation
  pullPolicy: Always

image_tag: generic-ubuntu.22.04
demand_postfix: ""

imagePullSecrets:
  - name: global-build-validation.registry-pull

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "256Mi"

proxy:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

autoscaling:
  minReplicas: 0
  maxReplicas: 20
  strategy:
    customScalingQueueLengthDeduction: -1
    customScalingRunningJobPercentage: "1.0"

historyLimit:
  successfulJobs: 0
  failedJobs: 1

azure_agent_root: /opt/az_agent

azure_devops:
  poolName: global-build-validation
  URL: https://dev.azure.com/YOUR_ORG

secrets:
  azpSecretName: global-build-validation.azp
