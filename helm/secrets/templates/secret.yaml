---
kind: Secret
apiVersion: v1
metadata:
  name: global-build-validation.azp
type: Opaque
stringData:
  AZP_POOL: {{ .Values.azure_devops.poolName | quote }}
  AZP_URL: {{ .Values.azure_devops.URL | quote }}
  AZP_TOKEN: {{ .Values.azure_devops_token | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: global-build-validation.registry-pull
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
