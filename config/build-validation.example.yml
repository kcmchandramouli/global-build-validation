---
# Copy this file to the root of a consumer repository as build-validation.yml
build-validation:
  markdown-link-check:
    error_as_warning: false
  markdownlint:
    error_as_warning: false
  prettier:
    error_as_warning: false
  python:
    black:
      error_as_warning: false
    flake8:
      error_as_warning: false
    ruff:
      error_as_warning: false
    pylint:
      error_as_warning: false
      upload_junit: false
    pytest:
      upload_junit: false
    mypy:
      error_as_warning: false
  yamllint:
    error_as_warning: false
  terraform-format:
    error_as_warning: false
  terraform-validation:
    error_as_warning: false
  unreferenced-image-check:
    error_as_warning: true
  branch-name-validation:
    error_as_warning: false
    branch_regex: "^(main|master|develop|(feature|feat|fix|hotfix|release|chore)/[A-Za-z0-9._-]+)$"
