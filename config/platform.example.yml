---
# Platform settings for building images and deploying optional self-hosted agents.
# Copy to config/platform.yml and replace the placeholders.

image_registry: ghcr.io/YOUR_ORG/global-build-validation
image_repository: global-build-validation

azure_devops:
  organization_url: https://dev.azure.com/YOUR_ORG
  project: YOUR_PROJECT
  pool_name: global-build-validation

helm:
  namespace: global-build-validation
  image_pull_secret: global-build-validation.registry-pull
