---
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - helm/**

pr:
  paths:
    include:
      - helm/**

parameters:
  - name: vmImage
    type: string
    default: ubuntu-22.04

jobs:
  - job: HelmLint
    displayName: Lint Helm charts
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self
        fetchDepth: 1
      - task: HelmInstaller@1
        inputs:
          helmVersionToInstall: latest
      - script: |
          set -e
          helm lint helm/agent
          helm lint helm/secrets --values helm/secrets/values.example.yaml
        displayName: helm lint
