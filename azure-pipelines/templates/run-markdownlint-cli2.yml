---
parameters:
  - name: condition
    type: string
    default: succeeded()
  - name: imageRegistry
    type: string
  - name: imageRepository
    type: string
    default: global-build-validation
  - name: useSelfHostedAgents
    type: boolean
    default: false
  - name: poolName
    type: string
    default: global-build-validation
  - name: vmImage
    type: string
    default: ubuntu-22.04
  - name: error_as_warning
    type: boolean
    default: false

jobs:
  - job: MarkdownlintCli2
    displayName: Run markdownlint-cli2
    condition: ${{ parameters.condition }}
    ${{ if eq(parameters.useSelfHostedAgents, true) }}:
      pool:
        name: ${{ parameters.poolName }}
        demands:
          - markdownlint-cli2.v1
    ${{ else }}:
      pool:
        vmImage: ${{ parameters.vmImage }}
      container:
        image: ${{ parameters.imageRegistry }}/${{ parameters.imageRepository }}:markdownlint-cli2.v1
        options: --entrypoint ""
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 2
      - template: list-modified-files.yml
        parameters:
          outputFile: /tmp/markdownlint-cli2.files
          sedFilter: "/\\.md$/I p"
      - script: docker_entrypoint.sh
        displayName: Run markdownlint
        env:
          ERROR_AS_WARNING: ${{ parameters.error_as_warning }}
      - task: PublishTestResults@2
        displayName: Publish markdownlint JUnit report
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: markdownlint-cli2-junit.xml
          testRunTitle: Markdownlint test results
          failTaskOnFailedTests: false
