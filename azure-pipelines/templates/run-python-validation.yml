---
parameters:
  - name: condition
    type: string
    default: succeeded()
  - name: imageRegistry
    type: string
  - name: imageRepository
    type: string
    default: global-build-validation
  - name: useSelfHostedAgents
    type: boolean
    default: false
  - name: poolName
    type: string
    default: global-build-validation
  - name: vmImage
    type: string
    default: ubuntu-22.04
  - name: error_as_warning
    type: boolean
    default: false
  - name: python_tests
    type: object
    default:
      - black
      - flake8
      - ruff
      - pylint
      - mypy
      - pytest

jobs:
  - job: PythonValidation
    displayName: Run python validation
    condition: ${{ parameters.condition }}
    ${{ if eq(parameters.useSelfHostedAgents, true) }}:
      pool:
        name: ${{ parameters.poolName }}
        demands:
          - python-validation.v1
    ${{ else }}:
      pool:
        vmImage: ${{ parameters.vmImage }}
      container:
        image: ${{ parameters.imageRegistry }}/${{ parameters.imageRepository }}:python-validation.v1
        options: --entrypoint ""
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 2
      - template: list-modified-files.yml
        parameters:
          outputFile: /tmp/python.files
          sedFilter: "/\\.py$/I p"
      - ${{ each python_test in parameters.python_tests }}:
          - ${{ if eq(python_test, 'flake8') }}:
              - script: |
                  RunFlake8=true
                  if [ -e ".flake8" ]; then
                    RunFlake8=false
                  fi
                  echo "##vso[task.setvariable variable=RunFlake8]${RunFlake8}"
                displayName: Check if flake8 is needed
                condition: succeededOrFailed()
              - script: docker_entrypoint.sh -s flake8
                displayName: Run flake8
                condition: and(succeededOrFailed(), eq(variables['RunFlake8'], 'true'))
                env:
                  ERROR_AS_WARNING: ${{ parameters.error_as_warning }}
          - ${{ else }}:
              - script: docker_entrypoint.sh -s ${{ python_test }}
                displayName: Run ${{ python_test }}
                condition: succeededOrFailed()
                env:
                  ERROR_AS_WARNING: ${{ parameters.error_as_warning }}
      - task: PublishTestResults@2
        displayName: Publish pylint JUnit report
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: pylint.results.xml
          testRunTitle: Pylint test results
          failTaskOnFailedTests: false
      - task: PublishTestResults@2
        displayName: Publish pytest JUnit report
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: pytest.results.xml
          testRunTitle: Pytest results
          failTaskOnFailedTests: false
