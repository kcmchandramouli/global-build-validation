---
parameters:
  - name: condition
    type: string
    default: succeeded()
  - name: imageRegistry
    type: string
  - name: imageRepository
    type: string
    default: global-build-validation
  - name: useSelfHostedAgents
    type: boolean
    default: false
  - name: poolName
    type: string
    default: global-build-validation
  - name: vmImage
    type: string
    default: ubuntu-22.04
  - name: error_as_warning
    type: boolean
    default: false

jobs:
  - job: PrettierCheck
    displayName: Run prettier --check
    condition: ${{ parameters.condition }}
    ${{ if eq(parameters.useSelfHostedAgents, true) }}:
      pool:
        name: ${{ parameters.poolName }}
        demands:
          - prettier-check.v1
    ${{ else }}:
      pool:
        vmImage: ${{ parameters.vmImage }}
      container:
        image: ${{ parameters.imageRegistry }}/${{ parameters.imageRepository }}:prettier-check.v1
        options: --entrypoint ""
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 2
      - template: list-modified-files.yml
        parameters:
          outputFile: /tmp/prettier-check.files
          sedFilter: "/\\.md$/I p;/\\.yml$/I p;/\\.yaml$/I p;/\\.toml$/I p;"
      - script: docker_entrypoint.sh
        displayName: Run prettier
        env:
          ERROR_AS_WARNING: ${{ parameters.error_as_warning }}
