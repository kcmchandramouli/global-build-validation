---
parameters:
  - name: condition
    type: string
    default: succeeded()
  - name: imageRegistry
    type: string
  - name: imageRepository
    type: string
    default: global-build-validation
  - name: useSelfHostedAgents
    type: boolean
    default: false
  - name: poolName
    type: string
    default: global-build-validation
  - name: vmImage
    type: string
    default: ubuntu-22.04
  - name: error_as_warning
    type: boolean
    default: false

jobs:
  - job: TerraformFormat
    displayName: Run terraform format
    condition: ${{ parameters.condition }}
    ${{ if eq(parameters.useSelfHostedAgents, true) }}:
      pool:
        name: ${{ parameters.poolName }}
        demands:
          - terraform-format.v1
    ${{ else }}:
      pool:
        vmImage: ${{ parameters.vmImage }}
      container:
        image: ${{ parameters.imageRegistry }}/${{ parameters.imageRepository }}:terraform-format.v1
        options: --entrypoint ""
    workspace:
      clean: all
    steps:
      - checkout: self
        fetchDepth: 2
      - template: list-modified-files.yml
        parameters:
          outputFile: /tmp/terraform-format.files
          sedFilter: "/\\.tf$/I p"
      - script: docker_entrypoint.sh
        displayName: Run terraform fmt
        env:
          ERROR_AS_WARNING: ${{ parameters.error_as_warning }}
