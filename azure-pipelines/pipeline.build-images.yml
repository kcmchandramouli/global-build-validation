---
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - images/**

schedules:
  - cron: "0 0 * * 0"
    displayName: Weekly image rebuild
    branches:
      include:
        - main
    always: true

parameters:
  - name: imageRegistry
    displayName: Container registry (for image names)
    type: string
    default: ""
  - name: imageRepository
    displayName: Image repository name
    type: string
    default: global-build-validation
  - name: dockerRegistryServiceConnection
    displayName: Azure DevOps Docker registry service connection
    type: string
    default: ""
  - name: vmImage
    type: string
    default: ubuntu-22.04
  - name: images
    type: object
    default:
      - dockerfile: images/generic-ubuntu/Dockerfile
        tag: generic-ubuntu.22.04
      - dockerfile: images/cspell/Dockerfile
        tag: cspell.6
      - dockerfile: images/markdown-link-check/Dockerfile
        tag: markdown-link-check.3
      - dockerfile: images/markdownlint-cli2/Dockerfile
        tag: markdownlint-cli2.v1
      - dockerfile: images/prettier-check/Dockerfile
        tag: prettier-check.v1
      - dockerfile: images/python-validation/Dockerfile
        tag: python-validation.v1
      - dockerfile: images/terraform-format/Dockerfile
        tag: terraform-format.v1
      - dockerfile: images/terraform-validation/Dockerfile
        tag: terraform-validation.v1
      - dockerfile: images/unreferenced-image-check/Dockerfile
        tag: unreferenced-image-check.v1
      - dockerfile: images/yamllint/Dockerfile
        tag: yamllint.v1

jobs:
  - ${{ each image in parameters.images }}:
      - job: ${{ replace(replace(replace(image.tag, '-', '_'), '.', '_'), '/', '_') }}
        displayName: Build ${{ image.tag }}
        pool:
          vmImage: ${{ parameters.vmImage }}
        timeoutInMinutes: 120
        steps:
          - checkout: self
            fetchDepth: 1
          - task: Docker@2
            displayName: Build and push ${{ image.tag }}
            inputs:
              command: buildAndPush
              Dockerfile: ${{ image.dockerfile }}
              buildContext: $(Build.SourcesDirectory)
              repository: ${{ parameters.imageRepository }}
              tags: ${{ image.tag }}
              ${{ if ne(parameters.dockerRegistryServiceConnection, '') }}:
                containerRegistry: ${{ parameters.dockerRegistryServiceConnection }}
